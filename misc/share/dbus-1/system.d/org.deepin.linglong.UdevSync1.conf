<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.deepin.linglong.UdevSync1"/>
    <allow send_destination="org.deepin.linglong.UdevSync1"/>
    <allow receive_sender="org.deepin.linglong.UdevSync1"/>
  </policy>

  <policy context="default">
    <deny send_destination="org.deepin.linglong.UdevSync1"/>
  </policy>

  <policy user="@LINGLONG_USERNAME@">
    <allow send_destination="org.deepin.linglong.UdevSync1"
           send_interface="org.deepin.linglong.UdevSync1"
           send_member="AcquireAppRules"/>
    <allow send_destination="org.deepin.linglong.UdevSync1"
           send_interface="org.deepin.linglong.UdevSync1"
           send_member="ReleaseAppRules"/>
    <allow send_destination="org.deepin.linglong.UdevSync1"
           send_interface="org.deepin.linglong.UdevSync1"
           send_member="SyncExportedAppRules"/>
    <allow send_destination="org.deepin.linglong.UdevSync1"
           send_interface="org.deepin.linglong.UdevSync1"
           send_member="RemoveAppRules"/>
  </policy>
</busconfig>
